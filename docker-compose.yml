
services:
  postgres:
    continer_name: dailyCode_postgres
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-dailycode}
      POSTGRES_USER: ${DB_USER:-dailycode}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?TempPassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
