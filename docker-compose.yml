name: dailycode

services:
  postgres:
    container_name: dailyCode_postgres
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-dailycode}
      POSTGRES_USER: ${DB_USER:-dailycode}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""] # ($$ lets the container expand the variables..)
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
