spring:
  application:
    name: dailycode
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:dailycode}
    username: ${DB_USER:dailycode}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      format_sql: true
      highlight_sql: true
    show-sql: true

server:
  address: 127.0.0.1

discord:
  token: ${DISCORD_TOKEN:}
  test-guild-id: ${DISCORD_TEST_GUILD_ID:}

leetcode:
  base-url: https://leetcode.com
  problem-cache:
    ttl: PT1H
    maximum-size: 1000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
