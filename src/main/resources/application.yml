spring:
  application:
    name: dailycode
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:dailycode}
    username: ${DB_USER:dailycode}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
      format_sql: true
      highlight_sql: true
    show-sql: true
